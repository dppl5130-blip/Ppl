name: Genesis Hyper Upgrade

on:
  issues:
    types: [opened, labeled, reopened]
  workflow_dispatch:

# Autonomous coding is restricted to the dedicated Genesis issue and publishes a PR.
# Add OPENAI_API_KEY as a GitHub Actions secret before execution.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  codex:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.state == 'open' && github.event.issue.number == 1 &&
       contains(github.event.issue.title, 'Genesis Hyper-Resilience'))
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.meta.outputs.branch }}
      final_message: ${{ steps.run_codex.outputs.final-message }}
    steps:
      - name: Checkout Genesis
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Prepare execution metadata
        id: meta
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number || 1 }}
        run: |
          set -euo pipefail
          branch="codex/genesis-hyper-resilience-${ISSUE_NUMBER}-${RUN_ID}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Validate upgrade prompt
        shell: bash
        run: |
          set -euo pipefail
          test -s services/router/gpt6-hyper-upgrade-prompt.md
          grep -q "60%" services/router/gpt6-hyper-upgrade-prompt.md
          grep -q "Hyper-Resilience" services/router/gpt6-hyper-upgrade-prompt.md

      - name: Install project dependencies and run baseline tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -f apps/api/package.json ]; then
            cd apps/api
            npm install --ignore-scripts --no-audit --no-fund
            npm test --if-present
          fi

      - name: Run Codex coding agent
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          model: gpt-5.3-codex
          effort: xhigh
          output-file: codex-final-message.txt
          prompt-file: services/router/gpt6-hyper-upgrade-prompt.md

      # Codex is intentionally the final privileged agent step. Its workspace is
      # exported afterward so a fresh runner can publish the result as a PR.
      - name: Package agent workspace
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='./.git' --exclude='./node_modules' --exclude='./apps/api/node_modules' \
            -czf /tmp/genesis-codex-workspace.tgz .

      - name: Upload agent workspace
        uses: actions/upload-artifact@v4
        with:
          name: genesis-codex-workspace-${{ github.run_id }}
          path: /tmp/genesis-codex-workspace.tgz
          retention-days: 7

  publish:
    needs: codex
    if: needs.codex.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download Codex workspace
        uses: actions/download-artifact@v4
        with:
          name: genesis-codex-workspace-${{ github.run_id }}
          path: /tmp/codex-artifact

      - name: Apply Codex changes
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/codex-artifact/genesis-codex-workspace.tgz -C "$GITHUB_WORKSPACE"

      - name: Create review branch and commit
        env:
          BRANCH: ${{ needs.codex.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "Codex produced no repository changes."
            exit 0
          fi
          git commit -m "feat: execute Genesis hyper-resilience sprint"
          git push --set-upstream origin "$BRANCH"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.codex.outputs.branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number || 1 }}
          CODEX_MESSAGE: ${{ needs.codex.outputs.final_message }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git rev-parse --verify "origin/$BRANCH" >/dev/null 2>&1; then
            echo "No branch was pushed; nothing to open."
            exit 0
          fi
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Genesis: hyper-resilience coding agent implementation" \
            --body "Automated Codex implementation for Issue #${ISSUE_NUMBER}.\n\nCodex summary:\n${CODEX_MESSAGE}\n\nReview the generated changes and test results before merging."

      - name: Report completion on issue
        if: always() && github.event.issue.number != ''
        uses: actions/github-script@v7
        env:
          CODEX_MESSAGE: ${{ needs.codex.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const issue = context.payload.issue;
            if (!issue) return;
            const summary = process.env.CODEX_MESSAGE || 'Codex completed without a final summary.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `## Genesis coding agent completed\n\nCodex was invoked through the GitHub Actions workflow. The workflow attempted to publish its workspace as a pull request.\n\n### Agent summary\n\n${summary}`
            });
